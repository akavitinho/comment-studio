<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'">
<title>Navegador</title><link rel="stylesheet" href="free-browser.css"></head>
<body><div id="tab-strip"><div id="tabs" role="tablist" aria-label="Abas do navegador"></div><button id="new-tab" type="button" aria-label="Nova aba" title="Nova aba (Ctrl+T)">+</button></div><form id="bar"><button id="back" type="button" aria-label="Voltar" title="Voltar (Alt+←)">‹</button><button id="forward" type="button" aria-label="Avançar" title="Avançar (Alt+→)">›</button><button id="reload" type="button" aria-label="Recarregar" title="Recarregar (Ctrl+R)">↻</button><button id="home" type="button" aria-label="Página inicial" title="Página inicial">⌂</button><input id="address" type="text" aria-label="Pesquisar ou digitar endereço" placeholder="Pesquisar ou digitar endereço" autocomplete="off" spellcheck="false"><button id="go" type="submit">Ir</button></form><span id="status" role="status"></span><script src="free-browser.js"></script></body></html>
